name: cellmatchr
channels:
  - conda-forge
  - defaults
dependencies:
  # ── Core Python ────────────────────────────────────────────────────────────
  # Pin to 3.11 — matches the verified working CellTinder environment.
  # Python 3.12 pulls newer numpy (2.x) which breaks many dependencies.
  - python=3.11

  # ── Deep learning ──────────────────────────────────────────────────────────
  # Exact versions from the working CellTinder env (GPU: replace with the
  # matching CUDA wheel from https://pytorch.org/get-started/locally/)
  - pytorch=2.10.0
  - torchvision=0.25.0

  # ── Microscopy segmentation ────────────────────────────────────────────────
  # micro_sam 1.7.0 has built-in compatibility for both old ('block') and
  # new ('conv') decoder checkpoint key formats, so all published bioimage.io
  # checkpoints load cleanly.  Exact version confirmed working in CellTinder.
  - micro_sam=1.7.0
  - torch_em=0.8.1              # exact match to CellTinder working env

  # ── Image I/O ──────────────────────────────────────────────────────────────
  - tifffile=2026.1.28          # exact CellTinder version; newer removes stripnull used by czifile
  - aicsimageio=4.10.0          # exact match to CellTinder working env
  - aicspylibczi=3.3.1          # Zeiss CZI support
  - czifile=2019.7.2.1          # exact CellTinder version; newer breaks with imagecodecs
  - imagecodecs=2026.1.14       # newer versions break czifile (jxr_decode removed)
  - pillow>=9.0

  # ── Numerical / scientific ─────────────────────────────────────────────────
  # CRITICAL: numpy MUST stay below 2.0.  numpy 2.x is not backward-compatible
  # and breaks micro_sam, torch_em, and several imaging packages.
  # Pin to 1.26.4 — exact version from CellTinder working env.
  - numpy=1.26.4
  - scipy>=1.10
  - scikit-image>=0.20
  - scikit-learn=1.8.0          # exact CellTinder version
  - pandas>=2.0

  # ── Visualisation ──────────────────────────────────────────────────────────
  - matplotlib>=3.7
  - napari=0.6.6                # exact match to CellTinder working env
  - pyqt>=5.15                  # Qt backend for napari / validator
  - qtpy=2.4.3                  # exact CellTinder version
  - opencv=4.12.0               # cv2 used by segmentation.py; exact CellTinder version

  # ── Pipeline utilities ─────────────────────────────────────────────────────
  - tqdm>=4.60
  - openpyxl>=3.1              # Excel output from analysis step

  # ── pip-only packages ──────────────────────────────────────────────────────
  - pip
  - pip:
      - roifile                # read Fiji/ImageJ .roi files in the analysis step
      - slideio                # VSI (Olympus) file reader for the VSI Converter
